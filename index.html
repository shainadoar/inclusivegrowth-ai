document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ection data-tone=\"0\" style=\"min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:120px 40px 80px\">\n    <div style=\"max-width:1240px;margin:0 auto;width:100%;position:relative\">\n      <div style=\"position:absolute;right:0;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#E6BC64,#D9A441);box-shadow:0 0 110px rgba(217,164,65,.45);animation:ovpulse 7s ease-in-out infinite\"><\u002Fdiv>\n      <div data-reveal=\"\" style=\"font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#D9A441;font-weight:600\">A project of Onward Ventures<\u002Fdiv>\n      <h1 data-reveal=\"\" style=\"font-weight:700;font-size:clamp(48px,7.2vw,104px);line-height:.94;letter-spacing:-.03em;text-transform:uppercase;margin:26px 0 0;max-width:1060px;text-wrap:balance\">An alternative approach to AI's impact on <span style=\"color:#D9A441\">our economy<\u002Fspan>.<\u002Fh1>\n      <p data-reveal=\"\" style=\"font-size:clamp(19px,1.6vw,25px);line-height:1.5;color:#A8A390;max-width:660px;margin:34px 0 0;text-wrap:pretty\">AI doesn't have to happen to us. We can chart our own path — but we must be intentional, and we must start where the evidence actually is.<\u002Fp>\n      <div data-reveal=\"\" style=\"display:flex;gap:16px;flex-wrap:wrap;margin-top:44px\">\n        <a href=\"#evidence\" style=\"background:#D9A441;color:#12130C;padding:16px 28px;border-radius:3px;font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase\" style-hover=\"background:#E6BC64\">Read the case<\u002Fa>\n        <a href=\"#contact\" style=\"border:1px solid rgba(238,235,220,.22);color:#EEEBDC;padding:16px 28px;border-radius:3px;font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase\" style-hover=\"border-color:#EEEBDC\">Get involved<\u002Fa>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:flex;align-items:center;gap:14px;margin-top:96px;color:#6E6A57;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600\">\n        <span style=\"animation:ovdrop 2.4s ease-in-out infinite\">↓<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div id=\"evidence\" style=\"max-width:1240px;margin:0 auto;padding:0 40px\">\n    <div data-reveal=\"\" style=\"display:flex;align-items:baseline;justify-content:space-between;gap:24px;padding:28px 0;border-top:1px solid rgba(238,235,220,.18);border-bottom:1px solid rgba(238,235,220,.18);flex-wrap:wrap\">\n      <span style=\"font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#D9A441;font-weight:600\">Part one — The call to action<\u002Fspan>\n      <span style=\"font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#6E6A57;font-weight:500\">Where the conversation stands today<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <section data-tone=\"1\" style=\"min-height:100vh;display:flex;align-items:center;padding:120px 40px\">\n    <div style=\"max-width:1240px;margin:0 auto;width:100%\">\n      <div data-reveal=\"\" style=\"display:flex;align-items:center;gap:14px\">\n        <span style=\"font-weight:700;font-size:15px;color:#D9A441;letter-spacing:.04em\">01<\u002Fspan>\n        <span style=\"width:38px;height:1px;background:rgba(238,235,220,.3)\"><\u002Fspan>\n        <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#D9A441\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;display:block\"><path d=\"M2 12h4l3 7 4-14 3 9h6\"><\u002Fpath><\u002Fsvg><span style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#A8A390;font-weight:600\">Sentiment<\u002Fspan>\n      <\u002Fdiv>\n      <h2 data-reveal=\"\" style=\"font-weight:700;font-size:clamp(38px,5.6vw,84px);line-height:.96;letter-spacing:-.04em;text-transform:uppercase;color:#D9A441;margin:34px 0 0;max-width:1080px;text-wrap:balance\">There is a growing fear, mistrust and anger at AI.<\u002Fh2>\n      <p data-reveal=\"\" style=\"font-size:clamp(17px,1.4vw,21px);line-height:1.55;color:#A8A390;margin:24px 0 0;max-width:720px;text-wrap:pretty\">In the absence of a single enemy, it is being directed at executives — on stage, in the workplace, and at their front doors — and at the most visible thing AI builds. And this is just the beginning.<\u002Fp>\n\n      <div data-r=\"cols\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0;margin-top:52px;border-top:1px solid rgba(238,235,220,.18);border-bottom:1px solid rgba(238,235,220,.18)\">\n        <div style=\"padding:38px 40px 38px 0;border-right:1px solid rgba(238,235,220,.18)\">\n          <div data-reveal=\"\" data-stagger=\"0\" style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#D9A441;font-weight:700\">The mood<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"0\" style=\"font-weight:700;font-size:clamp(56px,8vw,126px);line-height:.86;letter-spacing:-.05em;color:#D9A441;margin-top:18px\">1 in 2<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"1\" style=\"font-size:clamp(16px,1.35vw,20px);line-height:1.45;color:#EEEBDC;margin-top:18px;max-width:420px;text-wrap:pretty\">American adults say the growing use of AI in everyday life makes them more concerned than excited.<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"1\" style=\"font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#6E6A57;margin-top:12px;font-weight:700\">Pew Research Center<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:38px 0 38px 40px\">\n          <div data-reveal=\"\" data-stagger=\"0\" style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#A8A390;font-weight:700\">Where it lands<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"0\" style=\"font-weight:700;font-size:clamp(56px,8vw,126px);line-height:.86;letter-spacing:-.05em;color:#EEEBDC;margin-top:18px\">71%<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"1\" style=\"font-size:clamp(16px,1.35vw,20px);line-height:1.45;color:#EEEBDC;margin-top:18px;max-width:420px;text-wrap:pretty\">oppose a data center near them — 48% strongly. Higher than opposition to a nearby nuclear plant, and above the all-time nuclear high of 63%.<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"1\" style=\"font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#6E6A57;margin-top:12px;font-weight:700\">Gallup, March 2026<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div ref=\"{{ evidenceRef }}\" style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:36px;align-items:start\">\n        <div data-reveal=\"\" data-stagger=\"0\" style=\"background:#EEEBDC;color:#22211A;border-radius:3px;padding:0 0 16px;box-shadow:0 18px 40px rgba(0,0,0,.35)\">\n          <div style=\"height:5px;background:#D9A441;border-radius:3px 3px 0 0\"><\u002Fdiv>\n          <div style=\"padding:14px 18px 0\">\n            <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n              <span style=\"font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:#F0EEE2;background:#22211A;padding:4px 7px;border-radius:2px\">Headline<\u002Fspan>\n              <span style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#D9A441\">NPR<\u002Fspan>\n              <span style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;color:#6E6A57\">May 2026<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-weight:700;font-size:clamp(16px,1.3vw,20px);line-height:1.14;letter-spacing:-.025em;margin-top:12px;text-wrap:balance\">Advice for 2026 commencement speakers: Don't bring up AI<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-stagger=\"1\" style=\"background:#EEEBDC;color:#22211A;border-radius:3px;padding:0 0 16px;box-shadow:0 18px 40px rgba(0,0,0,.35)\">\n          <div style=\"height:5px;background:#D9A441;border-radius:3px 3px 0 0\"><\u002Fdiv>\n          <div style=\"padding:14px 18px 0\">\n            <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n              <span style=\"font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:#F0EEE2;background:#22211A;padding:4px 7px;border-radius:2px\">Headline<\u002Fspan>\n              <span style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#D9A441\">NBC News<\u002Fspan>\n              <span style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;color:#6E6A57\">May 2026<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-weight:700;font-size:clamp(16px,1.3vw,20px);line-height:1.14;letter-spacing:-.025em;margin-top:12px;text-wrap:balance\">Former Google CEO Eric Schmidt booed during graduation speech about AI<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-stagger=\"2\" style=\"border-left:2px solid #D9A441;padding:2px 0 2px 18px\">\n          <div style=\"font-size:clamp(16px,1.3vw,19px);line-height:1.35;letter-spacing:-.01em;color:#EEEBDC\">“Deal with it. Like I said, it's a tool.” — a record executive, answering the boos at Middle Tennessee State's commencement.<\u002Fdiv>\n          <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#D9A441;margin-top:10px;font-weight:700\">Reported by NPR<\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-stagger=\"3\" style=\"border-top:1px solid rgba(238,235,220,.18);padding:14px 0 0\">\n          <div style=\"font-size:14px;line-height:1.5;color:#EEEBDC\">A Molotov cocktail was thrown at Sam Altman's home in April 2026; the house was struck by gunfire two days later. Councilmembers and county commissioners have faced shootings and death threats.<\u002Fdiv>\n          <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6E6A57;margin-top:8px;font-weight:600\">Cato Institute<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-tone=\"4\" style=\"min-height:100vh;display:flex;align-items:center;padding:120px 40px\">\n    <div style=\"max-width:1240px;margin:0 auto;width:100%\">\n      <div data-reveal=\"\" style=\"display:flex;align-items:center;gap:14px;justify-content:center\">\n        <span style=\"font-weight:700;font-size:15px;color:#D9A441;letter-spacing:.04em\">02<\u002Fspan>\n        <span style=\"width:38px;height:1px;background:rgba(238,235,220,.3)\"><\u002Fspan>\n        <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#D9A441\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;display:block\"><path d=\"M3 12h5\"><\u002Fpath><path d=\"M8 12l13-7\"><\u002Fpath><path d=\"M8 12l13 7\"><\u002Fpath><\u002Fsvg><span style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#A8A390;font-weight:600\">The forecasts<\u002Fspan>\n      <\u002Fdiv>\n      <h2 data-reveal=\"\" style=\"font-weight:700;font-size:clamp(34px,4.8vw,68px);line-height:.98;letter-spacing:-.03em;text-transform:uppercase;color:#D9A441;margin:34px auto 0;max-width:1000px;text-align:center;text-wrap:balance\">Predictions on the impact have a wild range.<\u002Fh2>\n      <p data-reveal=\"\" style=\"font-size:clamp(17px,1.4vw,20px);line-height:1.55;color:#A8A390;margin:22px auto 0;max-width:680px;text-align:center;text-wrap:pretty\">The same three years of evidence produce forecasts two orders of magnitude apart. Both of these are serious.<\u002Fp>\n\n      <div data-r=\"cols\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0;margin-top:64px;border-top:1px solid rgba(238,235,220,.18);border-bottom:1px solid rgba(238,235,220,.18)\">\n        <div style=\"padding:48px 44px 48px 0;border-right:1px solid rgba(238,235,220,.18)\">\n          <div data-reveal=\"\" data-stagger=\"0\" style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#D9A441;font-weight:700\">The alarm<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"0\" style=\"font-weight:700;font-size:clamp(72px,11vw,168px);line-height:.84;letter-spacing:-.05em;color:#D9A441;margin-top:22px\">50%<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"1\" style=\"font-size:clamp(17px,1.5vw,22px);line-height:1.4;color:#EEEBDC;margin-top:20px;max-width:440px;text-wrap:pretty\">of entry-level white-collar jobs gone within five years — with unemployment reaching 10–20%.<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"1\" style=\"font-size:14px;line-height:1.55;color:#A8A390;margin-top:20px;max-width:440px;text-wrap:pretty\">Anthropic's Dario Amodei, twice, on the record. Kai-Fu Lee has echoed the figure. Goldman Sachs, working from measured efficiency gains, puts the number at 2.5% — 6–7% under wide adoption.<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"2\" style=\"background:#EEEBDC;color:#22211A;border-radius:3px;padding:0 0 18px;box-shadow:0 18px 40px rgba(0,0,0,.35);margin-top:28px;max-width:460px\">\n            <div style=\"height:5px;background:#D9A441;border-radius:3px 3px 0 0\"><\u002Fdiv>\n            <div style=\"padding:16px 20px 0\">\n              <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n                <span style=\"font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:#F0EEE2;background:#22211A;padding:4px 7px;border-radius:2px\">Headline<\u002Fspan>\n                <span style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#D9A441\">Forbes<\u002Fspan>\n                <span style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;color:#6E6A57\">Feb 2026<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-weight:700;font-size:clamp(17px,1.4vw,21px);line-height:1.14;letter-spacing:-.025em;margin-top:12px;text-wrap:balance\">Dario Amodei Doubled Down On His AI Jobs Warning. Here's What's Different Now<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:48px 0 48px 44px\">\n          <div data-reveal=\"\" data-stagger=\"0\" style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#A8A390;font-weight:700\">The measurement<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"0\" style=\"font-weight:700;font-size:clamp(72px,11vw,168px);line-height:.84;letter-spacing:-.05em;color:#EEEBDC;margin-top:22px\">~1%<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"1\" style=\"font-size:clamp(17px,1.5vw,22px);line-height:1.4;color:#EEEBDC;margin-top:20px;max-width:440px;text-wrap:pretty\">change in the US occupational mix since 2022 — far less than computers or the internet at the same age.<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"1\" style=\"font-size:14px;line-height:1.55;color:#A8A390;margin-top:20px;max-width:440px;text-wrap:pretty\">Yale's Budget Lab finds no discernible labor market disruption in the 33 months after ChatGPT's release, and updates the finding monthly. Brookings concurs.<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"2\" style=\"border-left:2px solid #D9A441;padding:2px 0 2px 20px;margin-top:28px;max-width:460px\">\n            <div style=\"font-size:clamp(17px,1.4vw,20px);line-height:1.35;letter-spacing:-.01em;color:#EEEBDC\">“While anxiety over the effects of AI on today's labor market is widespread, our data suggests it remains largely speculative.”<\u002Fdiv>\n            <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#D9A441;margin-top:12px;font-weight:700\">The Budget Lab at Yale<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p data-reveal=\"\" data-stagger=\"3\" style=\"font-size:clamp(17px,1.4vw,20px);line-height:1.5;color:#EEEBDC;margin:40px auto 0;max-width:760px;text-align:center;text-wrap:pretty\">Planning for one and being handed the other is the risk. <span style=\"color:#D9A441\">Neither number tells a city what to do on Monday.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-tone=\"7\" style=\"min-height:100vh;display:flex;align-items:center;padding:120px 40px\">\n    <div style=\"max-width:1240px;margin:0 auto;width:100%\">\n      <div data-reveal=\"\" style=\"display:flex;align-items:center;gap:14px\">\n        <span style=\"font-weight:700;font-size:15px;color:#D9A441;letter-spacing:.04em\">03<\u002Fspan>\n        <span style=\"width:38px;height:1px;background:rgba(238,235,220,.3)\"><\u002Fspan>\n        <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#D9A441\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;display:block\"><path d=\"M4 3v18\"><\u002Fpath><path d=\"M8 8h12\"><\u002Fpath><path d=\"M8 16h12\"><\u002Fpath><\u002Fsvg><span style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#A8A390;font-weight:600\">The response<\u002Fspan>\n      <\u002Fdiv>\n      <h2 data-reveal=\"\" style=\"font-weight:700;font-size:clamp(38px,5.6vw,84px);line-height:.96;letter-spacing:-.04em;text-transform:uppercase;color:#D9A441;margin:34px 0 0;max-width:1080px;text-wrap:balance\">Responses are blunt — short on nuance and creativity.<\u002Fh2>\n      <p data-reveal=\"\" style=\"font-size:clamp(17px,1.4vw,21px);line-height:1.55;color:#A8A390;margin:24px 0 0;max-width:740px;text-wrap:pretty\">Two postures dominate. One stops the building. The other asks the builders to promise. Neither says what a place should build instead.<\u002Fp>\n\n      <div data-r=\"cols\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0;margin-top:56px;border-top:1px solid rgba(238,235,220,.18);border-bottom:1px solid rgba(238,235,220,.18)\">\n        <div style=\"padding:44px 44px 44px 0;border-right:1px solid rgba(238,235,220,.18)\">\n          <div data-reveal=\"\" data-stagger=\"0\" style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#D9A441;font-weight:700\">The ban<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"0\" style=\"font-weight:700;font-size:clamp(64px,9.5vw,150px);line-height:.85;letter-spacing:-.05em;color:#D9A441;margin-top:20px\">54<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"1\" style=\"font-size:clamp(16px,1.4vw,21px);line-height:1.42;color:#EEEBDC;margin-top:18px;max-width:440px;text-wrap:pretty\">local data center moratorium actions have already passed, of at least 63 attempted.<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"1\" style=\"font-size:14px;line-height:1.55;color:#A8A390;margin-top:18px;max-width:440px;text-wrap:pretty\">New York's legislature passed a one-year pause in June 2026. Maine came within a governor's veto of the first statewide moratorium. Statewide proposals have been introduced in 14 states, and a federal act would halt construction until a national framework exists.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:44px 0 44px 44px\">\n          <div data-reveal=\"\" data-stagger=\"0\" style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#A8A390;font-weight:700\">The pledge<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"0\" style=\"font-weight:700;font-size:clamp(64px,9.5vw,150px);line-height:.85;letter-spacing:-.05em;color:#EEEBDC;margin-top:20px\">10<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"1\" style=\"font-size:clamp(16px,1.4vw,21px);line-height:1.42;color:#EEEBDC;margin-top:18px;max-width:440px;text-wrap:pretty\">voluntary commitments in Michigan's Affordable and Responsible Growth Pledge.<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"1\" style=\"font-size:14px;line-height:1.55;color:#A8A390;margin-top:18px;max-width:440px;text-wrap:pretty\">Michigan chose a pledge over a moratorium — developers vow that residents won't pay for the energy or water. Google and Oracle signed. Advocates want it written into statute.<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"2\" style=\"border-left:2px solid #D9A441;padding:2px 0 2px 18px;margin-top:26px;max-width:440px\">\n            <div style=\"font-size:clamp(16px,1.35vw,20px);line-height:1.35;letter-spacing:-.01em;color:#EEEBDC\">“Pledges and promises are not enough.”<\u002Fdiv>\n            <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#D9A441;margin-top:10px;font-weight:700\">Michigan Sierra Club<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-tone=\"10\" style=\"min-height:100vh;display:flex;align-items:center;padding:120px 40px\">\n    <div style=\"max-width:1240px;margin:0 auto;width:100%\">\n      <div data-reveal=\"\" style=\"display:flex;align-items:center;gap:14px\">\n        <span style=\"font-weight:700;font-size:15px;color:#D9A441;letter-spacing:.04em\">04<\u002Fspan>\n        <span style=\"width:38px;height:1px;background:rgba(238,235,220,.3)\"><\u002Fspan>\n        <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#D9A441\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;display:block\"><path d=\"M12 4v16\"><\u002Fpath><path d=\"M5 20h14\"><\u002Fpath><path d=\"M3 8h18\"><\u002Fpath><path d=\"M6 8l-3 6h6z\"><\u002Fpath><path d=\"M18 8l-3 6h6z\"><\u002Fpath><\u002Fsvg><span style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#A8A390;font-weight:600\">The prediction, and the prescription<\u002Fspan>\n      <\u002Fdiv>\n\n      <div data-r=\"cols\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0;margin-top:44px;border-top:1px solid rgba(238,235,220,.18);border-bottom:1px solid rgba(238,235,220,.18)\">\n        <div style=\"padding:48px 48px 48px 0;border-right:1px solid rgba(238,235,220,.18)\">\n          <div data-reveal=\"\" data-stagger=\"0\" style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#D9A441;font-weight:700\">The prediction<\u002Fdiv>\n          <h2 data-reveal=\"\" data-stagger=\"0\" style=\"font-weight:700;font-size:clamp(28px,3.1vw,48px);line-height:1.02;letter-spacing:-.03em;text-transform:uppercase;color:#D9A441;margin:20px 0 0;max-width:520px;text-wrap:balance\">Extreme predictions of AGI, without a nuanced understanding of its potential impact.<\u002Fh2>\n\n          <div style=\"display:flex;flex-direction:column;gap:28px;margin-top:36px;max-width:540px\">\n            <div data-reveal=\"\" data-stagger=\"1\" style=\"border-left:2px solid #D9A441;padding:2px 0 2px 20px\">\n              <div style=\"font-size:clamp(17px,1.45vw,21px);line-height:1.35;letter-spacing:-.01em;color:#EEEBDC\">“We are now confident we know how to build AGI as we have traditionally understood it.”<\u002Fdiv>\n              <div style=\"font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#D9A441;margin-top:10px;font-weight:700\">Sam Altman <span style=\"color:#6E6A57;font-weight:600\">— “Reflections,” blog.samaltman.com, Jan 2025<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div data-reveal=\"\" data-stagger=\"2\" style=\"border-left:2px solid #D9A441;padding:2px 0 2px 20px\">\n              <div style=\"font-size:clamp(17px,1.45vw,21px);line-height:1.35;letter-spacing:-.01em;color:#EEEBDC\">A “country of geniuses in a datacenter” — compressing a century of scientific progress into five to ten years.<\u002Fdiv>\n              <div style=\"font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#D9A441;margin-top:10px;font-weight:700\">Dario Amodei <span style=\"color:#6E6A57;font-weight:600\">— “Machines of Loving Grace,” Oct 2024<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div data-reveal=\"\" data-stagger=\"3\" style=\"border-left:2px solid #D9A441;padding:2px 0 2px 20px\">\n              <div style=\"font-size:clamp(17px,1.45vw,21px);line-height:1.35;letter-spacing:-.01em;color:#EEEBDC\">“Probably none of us will have a job.” Work becomes optional, and AI provides any goods and services you want.<\u002Fdiv>\n              <div style=\"font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#D9A441;margin-top:10px;font-weight:700\">Elon Musk <span style=\"color:#6E6A57;font-weight:600\">— VivaTech, Paris, May 2024<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:48px 0 48px 48px\">\n          <div data-reveal=\"\" data-stagger=\"0\" style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#A8A390;font-weight:700\">The prescription<\u002Fdiv>\n          <h2 data-reveal=\"\" data-stagger=\"0\" style=\"font-weight:700;font-size:clamp(28px,3.1vw,48px);line-height:1.02;letter-spacing:-.03em;text-transform:uppercase;color:#EEEBDC;margin:20px 0 0;max-width:520px;text-wrap:balance\">And the only solution we've come up with is UBI or an AI wealth fund.<\u002Fh2>\n\n          <div style=\"display:flex;flex-direction:column;gap:28px;margin-top:36px;max-width:540px\">\n            <div data-reveal=\"\" data-stagger=\"1\" style=\"border-left:2px solid rgba(238,235,220,.35);padding:2px 0 2px 20px\">\n              <div style=\"font-size:clamp(17px,1.45vw,21px);line-height:1.35;letter-spacing:-.01em;color:#EEEBDC\">“Instead of throwing you out on the street, I'm going to reduce your workweek to 32 hours.”<\u002Fdiv>\n              <div style=\"font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#D9A441;margin-top:10px;font-weight:700\">Sen. Bernie Sanders <span style=\"color:#6E6A57;font-weight:600\">— The Joe Rogan Experience, 2025<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div data-reveal=\"\" data-stagger=\"2\" style=\"border-left:2px solid rgba(238,235,220,.35);padding:2px 0 2px 20px\">\n              <div style=\"font-size:clamp(17px,1.45vw,21px);line-height:1.35;letter-spacing:-.01em;color:#EEEBDC\">“The financial gains from the major advancements in artificial intelligence, automation, and new technology must benefit the working class, not just corporate CEOs and wealthy stockholders on Wall Street.”<\u002Fdiv>\n              <div style=\"font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#D9A441;margin-top:10px;font-weight:700\">Sen. Bernie Sanders <span style=\"color:#6E6A57;font-weight:600\">— Thirty-Two Hour Workweek Act, press release, Mar 2024<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div data-reveal=\"\" data-stagger=\"3\" style=\"background:#EEEBDC;color:#22211A;border-radius:3px;padding:0 0 18px;box-shadow:0 18px 40px rgba(0,0,0,.35);max-width:500px\">\n              <div style=\"height:5px;background:#D9A441;border-radius:3px 3px 0 0\"><\u002Fdiv>\n              <div style=\"padding:16px 20px 0\">\n                <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n                  <span style=\"font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:#F0EEE2;background:#22211A;padding:4px 7px;border-radius:2px\">Headline<\u002Fspan>\n                  <span style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#D9A441\">TIME<\u002Fspan>\n                  <span style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;color:#6E6A57\">Apr 2026<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-weight:700;font-size:clamp(20px,1.7vw,26px);line-height:1.1;letter-spacing:-.025em;margin-top:12px;text-wrap:balance\"><a href=\"https://time.com/article/2026/04/02/people-want-jobs-not-ubi/\" target=\"_blank\" rel=\"noopener\" style=\"color:inherit;text-decoration:none\">People Want Jobs, Not UBI<\u002Fa><\u002Fdiv>\n                <div style=\"font-size:14px;line-height:1.5;color:#4A473A;margin-top:12px\">Across 60 countries, 52% would choose a world of guaranteed jobs. Just 39% chose guaranteed income.<\u002Fdiv>\n                <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6E6A57;margin-top:10px;font-weight:600\">Windfall Trust &amp; Collective Intelligence Project, via TIME<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p data-reveal=\"\" data-stagger=\"4\" style=\"font-size:clamp(17px,1.4vw,21px);line-height:1.5;color:#EEEBDC;margin:40px 0 0;max-width:820px;text-wrap:pretty\">One side forecasts the end of work. The other proposes a cheque. <span style=\"color:#D9A441\">Neither describes what a place should build.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-tone=\"9\" style=\"min-height:100vh;display:flex;align-items:center;padding:120px 40px\">\n    <div style=\"max-width:1240px;margin:0 auto;width:100%\">\n      <div data-reveal=\"\" style=\"display:flex;align-items:center;gap:14px\">\n        <span style=\"font-weight:700;font-size:15px;color:#D9A441;letter-spacing:.04em\">05<\u002Fspan>\n        <span style=\"width:38px;height:1px;background:rgba(238,235,220,.3)\"><\u002Fspan>\n        <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#D9A441\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;display:block\"><circle cx=\"9\" cy=\"12\" r=\"6\"><\u002Fcircle><circle cx=\"15\" cy=\"12\" r=\"6\"><\u002Fcircle><\u002Fsvg><span style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#A8A390;font-weight:600\">Civic effort, and private effort<\u002Fspan>\n      <\u002Fdiv>\n      <h2 data-reveal=\"\" style=\"font-weight:700;font-size:clamp(38px,5.6vw,84px);line-height:.96;letter-spacing:-.04em;text-transform:uppercase;color:#D9A441;margin:34px 0 0;max-width:1080px;text-wrap:balance\">Everyone is working on half the problem.<\u002Fh2>\n      <p data-reveal=\"\" style=\"font-size:clamp(17px,1.4vw,21px);line-height:1.55;color:#A8A390;margin:24px 0 0;max-width:740px;text-wrap:pretty\">Both efforts are serious, well-funded, and led by capable people. Both are important. Neither addresses the economy-level impact, vision, programs and policies to shape our future.<\u002Fp>\n\n      <div data-r=\"cols\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0;margin-top:56px;border-top:1px solid rgba(238,235,220,.18);border-bottom:1px solid rgba(238,235,220,.18)\">\n        <div style=\"padding:44px 44px 44px 0;border-right:1px solid rgba(238,235,220,.18)\">\n          <div data-reveal=\"\" data-stagger=\"0\" style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#D9A441;font-weight:700\">The civic response — retrain and defend<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"0\" style=\"font-weight:700;font-size:clamp(56px,8vw,132px);line-height:.85;letter-spacing:-.05em;color:#D9A441;margin-top:20px\">$1B<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"1\" style=\"font-size:clamp(16px,1.4vw,21px);line-height:1.42;color:#EEEBDC;margin-top:18px;max-width:440px;text-wrap:pretty\">the target for <a href=\"https://www.raiseus.ai/about\" target=\"_blank\" rel=\"noopener\">RAISE US<\u002Fa>, a national workforce-transition platform — roughly half already raised.<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"1\" style=\"font-size:14px;line-height:1.55;color:#A8A390;margin-top:18px;max-width:440px;text-wrap:pretty\">Co-chaired by two former governors, backed by the OpenAI Foundation, Anthropic, Amazon and Microsoft, advising states on preparing workers for AI disruption. Serious money aimed squarely at training and transition — and nothing about what the local economy grows into.<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"2\" style=\"background:#EEEBDC;color:#22211A;border-radius:3px;padding:0 0 16px;box-shadow:0 18px 40px rgba(0,0,0,.35);margin-top:26px;max-width:460px\">\n            <div style=\"height:5px;background:#D9A441;border-radius:3px 3px 0 0\"><\u002Fdiv>\n            <div style=\"padding:14px 18px 0\">\n              <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n                <span style=\"font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:#F0EEE2;background:#22211A;padding:4px 7px;border-radius:2px\">Headline<\u002Fspan>\n                <span style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#D9A441\">Wall Street Journal<\u002Fspan>\n                <span style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;color:#6E6A57\">2026<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-weight:700;font-size:clamp(16px,1.3vw,21px);line-height:1.14;letter-spacing:-.025em;margin-top:12px;text-wrap:balance\">The New Push to Ready Millions for AI Career Upheaval<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:44px 0 44px 44px\">\n          <div data-reveal=\"\" data-stagger=\"0\" style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#A8A390;font-weight:700\">The private response — integrate<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"0\" style=\"font-weight:700;font-size:clamp(56px,8vw,132px);line-height:.85;letter-spacing:-.05em;color:#EEEBDC;margin-top:20px\">88%<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"1\" style=\"font-size:clamp(16px,1.4vw,21px);line-height:1.42;color:#EEEBDC;margin-top:18px;max-width:440px;text-wrap:pretty\">of organizations now use AI — but only 39% report any enterprise-level EBIT impact.<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"1\" style=\"font-size:14px;line-height:1.55;color:#A8A390;margin-top:18px;max-width:440px;text-wrap:pretty\">Roughly 6% qualify as high performers. Nearly two-thirds have not begun scaling at all. Efficiency is the stated objective of 80% of AI initiatives; growth rarely is.<\u002Fdiv>\n          <div data-reveal=\"\" data-stagger=\"2\" style=\"border-top:1px solid rgba(238,235,220,.18);padding:14px 0 0;margin-top:26px;max-width:440px\">\n            <div style=\"font-size:15px;line-height:1.5;color:#EEEBDC\">95% of enterprise generative-AI pilots deliver no measurable P&amp;L impact.<\u002Fdiv>\n            <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6E6A57;margin-top:8px;font-weight:600\">MIT Project NANDA<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-tone=\"11\" style=\"min-height:135vh;display:flex;align-items:center;justify-content:center;padding:140px 40px;overflow:hidden\">\n    <div style=\"max-width:1300px;margin:0 auto;width:100%;text-align:center\">\n      <div data-reveal=\"\" data-explode=\"scale(.9)\" style=\"display:flex;align-items:center;gap:14px;justify-content:center\">\n        <span style=\"font-weight:700;font-size:15px;color:#D9A441;letter-spacing:.04em\">06<\u002Fspan>\n        <span style=\"width:38px;height:1px;background:rgba(238,235,220,.3)\"><\u002Fspan>\n        <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#D9A441\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;display:block\"><path d=\"M8 4H4v16h4\"><\u002Fpath><path d=\"M16 4h4v16h-4\"><\u002Fpath><\u002Fsvg><span style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#A8A390;font-weight:600\">The gap<\u002Fspan>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-explode=\"scale(.72)\" data-r=\"big\" style=\"font-weight:700;font-size:clamp(46px,7.6vw,120px);line-height:.92;letter-spacing:-.045em;text-transform:uppercase;color:#D9A441;margin:44px auto 0;max-width:1140px;border-top:1px solid rgba(238,235,220,.2);border-bottom:1px solid rgba(238,235,220,.2);padding:48px 24px;text-wrap:balance\">No one is looking at the potential of AI to shape our economy, lives, and work in our liking.<\u002Fdiv>\n      <div data-reveal=\"\" data-stagger=\"0\" data-explode=\"translateY(30px)\" style=\"font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#A8A390;font-weight:700;margin:64px auto 0\">Four questions to answer at the local level<\u002Fdiv>\n      <div ref=\"{{ gapRef }}\" style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:stretch;gap:18px;margin:32px auto 0;max-width:1200px\">\n        <div data-reveal=\"\" data-stagger=\"0\" data-explode=\"translate(-90px,60px) scale(.6)\" style=\"min-width:0;border:1px solid rgba(238,235,220,.22);border-radius:4px;background:rgba(13,14,9,.6);padding:40px 18px;display:flex;align-items:center;justify-content:center\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:20px\"><div style=\"opacity:.9\"><svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#D9A441\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;display:block\"><path d=\"M3 21h18\"><\u002Fpath><path d=\"M6 21v-8\"><\u002Fpath><path d=\"M12 21V6\"><\u002Fpath><path d=\"M18 21v-11\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-weight:700;font-size:clamp(26px,3.3vw,58px);line-height:.98;letter-spacing:-.04em;text-transform:uppercase\">How much<span style=\"color:#D9A441\">?<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-stagger=\"1\" data-explode=\"translate(-30px,80px) scale(.6)\" style=\"min-width:0;border:1px solid rgba(238,235,220,.22);border-radius:4px;background:rgba(13,14,9,.6);padding:40px 18px;display:flex;align-items:center;justify-content:center\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:20px\"><div style=\"opacity:.9\"><svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#D9A441\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;display:block\"><path d=\"M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.5\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><div style=\"font-weight:700;font-size:clamp(26px,3.3vw,58px);line-height:.98;letter-spacing:-.04em;text-transform:uppercase\">Where<span style=\"color:#D9A441\">?<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-stagger=\"2\" data-explode=\"translate(30px,80px) scale(.6)\" style=\"min-width:0;border:1px solid rgba(238,235,220,.22);border-radius:4px;background:rgba(13,14,9,.6);padding:40px 18px;display:flex;align-items:center;justify-content:center\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:20px\"><div style=\"opacity:.9\"><svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#D9A441\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;display:block\"><circle cx=\"9\" cy=\"8\" r=\"3.2\"><\u002Fcircle><path d=\"M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5\"><\u002Fpath><path d=\"M16 5.4a3.2 3.2 0 0 1 0 6\"><\u002Fpath><path d=\"M18 15c2 .8 3.2 2.6 3.2 5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-weight:700;font-size:clamp(26px,3.3vw,58px);line-height:.98;letter-spacing:-.04em;text-transform:uppercase\">For whom<span style=\"color:#D9A441\">?<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-stagger=\"3\" data-explode=\"translate(90px,60px) scale(.6)\" style=\"min-width:0;border:1px solid rgba(238,235,220,.22);border-radius:4px;background:rgba(13,14,9,.6);padding:40px 18px;display:flex;align-items:center;justify-content:center\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:20px\"><div style=\"opacity:.9\"><svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#D9A441\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;display:block\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M15.5 8.5l-2 5-5 2 2-5z\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-weight:700;font-size:clamp(26px,3.3vw,58px);line-height:.98;letter-spacing:-.04em;text-transform:uppercase\">And how<span style=\"color:#D9A441\">?<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p data-reveal=\"\" data-stagger=\"4\" data-explode=\"translateY(40px)\" style=\"font-size:clamp(18px,1.6vw,23px);line-height:1.5;color:#A8A390;margin:56px auto 0;max-width:640px;text-wrap:pretty\">These are the four questions nobody is answering at the level where the answers actually matter — the place you live and work, and to benefit your everyday life.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#D9A441;color:#12130C;padding:0;position:relative;z-index:2;overflow:hidden\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:88px 40px 96px\">\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(24px,4vw,72px);align-items:center;margin-top:0\">\n        <div data-reveal=\"\" data-explode=\"scale(.55)\" style=\"font-weight:700;font-size:clamp(120px,20vw,300px);line-height:.76;letter-spacing:-.06em\">02<\u002Fdiv>\n        <div>\n          <div data-reveal=\"\" style=\"font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.7\">Part two<\u002Fdiv>\n          <div data-reveal=\"\" style=\"font-weight:700;font-size:clamp(34px,5vw,76px);line-height:.96;letter-spacing:-.03em;text-transform:uppercase;margin-top:18px;text-wrap:balance\">A new path<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"path\" data-tone=\"12\" style=\"min-height:100vh;display:flex;align-items:center;padding:120px 40px\">\n    <div style=\"max-width:1240px;margin:0 auto;width:100%\">\n      <h2 data-reveal=\"\" style=\"font-weight:700;font-size:clamp(40px,6.4vw,92px);line-height:.96;letter-spacing:-.03em;text-transform:uppercase;margin:30px 0 0;max-width:1080px;text-wrap:balance\">AI doesn't have to happen to us. We can chart our own path.<\u002Fh2>\n      <p data-reveal=\"\" style=\"font-size:clamp(22px,2.2vw,34px);line-height:1.3;color:#D9A441;margin:34px 0 0;font-weight:500;letter-spacing:-.02em\">But we must be intentional.<\u002Fp>\n      <div data-r=\"g3\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:72px\">\n        <div data-reveal=\"\" style=\"border:1px solid rgba(238,235,220,.18);border-radius:4px;padding:36px 30px;background:rgba(13,14,9,.55)\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\"><div style=\"font-weight:700;font-size:34px;color:#D9A441;letter-spacing:-.02em\">01<\u002Fdiv><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#D9A441\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;display:block\"><path d=\"M12 21V7\"><\u002Fpath><path d=\"M6 13l6-6 6 6\"><\u002Fpath><path d=\"M4 3h16\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div style=\"font-weight:700;font-size:19px;letter-spacing:.05em;text-transform:uppercase;margin:20px 0 12px\">Vision, then next week<\u002Fdiv>\n          <p style=\"font-size:17px;line-height:1.5;color:#A8A390;margin:0;text-wrap:pretty\">Future-forward visioning, paired with practical applications for the near term.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"border:1px solid rgba(238,235,220,.18);border-radius:4px;padding:36px 30px;background:rgba(13,14,9,.55)\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\"><div style=\"font-weight:700;font-size:34px;color:#D9A441;letter-spacing:-.02em\">02<\u002Fdiv><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#D9A441\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;display:block\"><path d=\"M12 3l9 17H3z\"><\u002Fpath><path d=\"M12 10v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div style=\"font-weight:700;font-size:19px;letter-spacing:.05em;text-transform:uppercase;margin:20px 0 12px\">Possibility and risk<\u002Fdiv>\n          <p style=\"font-size:17px;line-height:1.5;color:#A8A390;margin:0;text-wrap:pretty\">Imagining what's possible while balancing safety and risk — neither cheerleading nor alarm.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"border:1px solid rgba(238,235,220,.18);border-radius:4px;padding:36px 30px;background:rgba(13,14,9,.55)\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\"><div style=\"font-weight:700;font-size:34px;color:#D9A441;letter-spacing:-.02em\">03<\u002Fdiv><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#D9A441\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;display:block\"><circle cx=\"5\" cy=\"12\" r=\"2\"><\u002Fcircle><circle cx=\"19\" cy=\"6\" r=\"2\"><\u002Fcircle><circle cx=\"19\" cy=\"18\" r=\"2\"><\u002Fcircle><path d=\"M7 12h3l7-5\"><\u002Fpath><path d=\"M10 12l7 5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div style=\"font-weight:700;font-size:19px;letter-spacing:.05em;text-transform:uppercase;margin:20px 0 12px\">Facts, then scenarios<\u002Fdiv>\n          <p style=\"font-size:17px;line-height:1.5;color:#A8A390;margin:0;text-wrap:pretty\">Rooting analysis in facts, while scenario planning for the futures we can't yet see.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"min-height:80vh;display:flex;align-items:center;padding:110px 40px;background:#D9A441;color:#12130C;position:relative;z-index:2\">\n    <div style=\"max-width:1240px;margin:0 auto;width:100%\">\n      <div data-reveal=\"\" style=\"font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;opacity:.65\">The premise<\u002Fdiv>\n      <p data-reveal=\"\" style=\"font-weight:700;font-size:clamp(34px,5.2vw,76px);line-height:1.0;letter-spacing:-.03em;margin:28px 0 0;max-width:1080px;text-wrap:balance\">We can't predict the future. But we can get better information, scenario plan, invest today, and prepare for changes as they arise.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-tone=\"13\" style=\"min-height:100vh;display:flex;align-items:center;padding:120px 40px\">\n    <div style=\"max-width:1240px;margin:0 auto;width:100%\">\n      <div data-reveal=\"\" style=\"font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#D9A441;font-weight:600;text-align:center\">Part three — The questions<\u002Fdiv>\n      <h2 data-reveal=\"\" style=\"font-weight:700;font-size:clamp(36px,5.2vw,74px);line-height:.98;letter-spacing:-.03em;text-transform:uppercase;margin:28px auto 0;max-width:900px;text-align:center;text-wrap:balance\">We want to embrace a new path. How can we…<\u002Fh2>\n      <div style=\"margin-top:60px;border-top:1px solid rgba(238,235,220,.18)\">\n        <div data-reveal=\"\" data-r=\"qrow\" style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:28px;padding:32px 0;border-bottom:1px solid rgba(238,235,220,.18);align-items:baseline\">\n          <span style=\"display:flex;align-items:center;gap:12px\"><span style=\"font-weight:700;font-size:15px;color:#D9A441;letter-spacing:.04em\">01<\u002Fspan>< 3<\u002Fspan><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#D9A441\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;display:block\"><circle cx=\"9\" cy=\"8\" r=\"3.2\"><\u002Fcircle><path d=\"M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5\"><\u002Fpath><path d=\"M16 5.4a3.2 3.2 0 0 1 0 6\"><\u002Fpath><path d=\"M18 15c2 .8 3.2 2.6 3.2 5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span style=\"font-size:clamp(21px,2.1vw,32px);line-height:1.3;letter-spacing:-.02em;text-wrap:pretty\">Ensure our workforce is ready to transition into newly created and in-demand jobs?<\u002Fspan>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-r=\"qrow\" style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:28px;padding:32px 0;border-bottom:1px solid rgba(238,235,220,.18);align-items:baseline\">\n          <span style=\"display:flex;align-items:center;gap:12px\"><span style=\"font-weight:700;font-size:15px;color:#D9A441;letter-spacing:.04em\">04<\u002Fspan><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#D9A441\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;display:block\"><path d=\"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span style=\"font-size:clamp(21px,2.1vw,32px);line-height:1.3;letter-spacing:-.02em;text-wrap:pretty\">Invest in programs that enable the safe integration of AI?<\u002Fspan>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-r=\"qrow\" style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:28px;padding:32px 0;border-bottom:1px solid rgba(238,235,220,.18);align-items:baseline\">\n          <span style=\"display:flex;align-items:center;gap:12px\"><span style=\"font-weight:700;font-size:15px;color:#D9A441;letter-spacing:.04em\">05<\u002Fspan><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stro ght:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin:16px 0 12px\">Case studies &amp; use cases<\u002Fdiv>\n          <p style=\"font-size:17px;line-height:1.55;color:#6E6A57;margin:0;text-wrap:pretty\">Things are moving fast. Innovative new models are popping up everywhere — and unless following the podcast, the Reddit post, and the networks is your full-time job, you'll miss them.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"build\" data-tone=\"14\" style=\"padding:130px 40px;position:relative;z-index:1\">\n    <div style=\"max-width:1240px;margin:0 auto;width:100%\">\n      <div data-reveal=\"\" style=\"font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#D9A441;font-weight:600\">Part five — Work with us<\u002Fdiv>\n      <h2 data-reveal=\"\" style=\"font-weight:700;font-size:clamp(40px,6vw,88px);line-height:.96;letter-spacing:-.03em;text-transform:uppercase;margin:26px 0 0;max-width:900px;text-wrap:balance\">Build with us<\u002Fh2>\n      <p data-reveal=\"\" style=\"font-size:clamp(18px,1.5vw,23px);line-height:1.55;color:#A8A390;margin:26px 0 0;max-width:720px;text-wrap:pretty\">Beyond the platform, three ways to put this to work in a specific place.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;margin-top:64px\">\n        <div data-reveal=\"\" data-stagger=\"0\" style=\"border:1px solid rgba(238,235,220,.18);border-radius:4px;padding:40px 34px;background:rgba(13,14,9,.6)\">\n          <div style=\"font-weight:700;font-size:15px;color:#D9A441;letter-spacing:.04em\">01<\u002Fdiv>\n          <div style=\"margin-top:22px\"><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#D9A441\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;display:block\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"4.5\ \"email\" required=\"\" style=\"background:transparent;border:0;border-bottom:1px solid rgba(238,235,220,.28);color:#EEEBDC;font-size:17px;padding:9px 0\">\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#A8A390;font-weight:600\">What are you working on?<\u002Fspan>\n              <textarea rows=\"3\" name=\"message\" style=\"background:transparent;border:0;border-bottom:1px solid rgba(238,235,220,.28);color:#EEEBDC;font-size:17px;padding:9px 0;resize:vertical\"><\u002Ftextarea>\n            <\u002Flabel>\n            <input type=\"text\" name=\"_gotcha\" tabindex=\"-1\" autocomplete=\"off\" aria-hidden=\"true\" style=\"position:absolute;left:-9999px;width:1px;height:1px;opacity:0\">\n            <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:14px;line-height:1.45;color:#E6BC64\">{{ errorText }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <button type=\"submit\" disabled=\"{{ sending }}\" style=\"margin-top:10px;background:#D9A441;color:#12130C;border:0;border-radius:3px;padding:16px 24px;font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer\" style-hover=\"background:#E6BC64\">{{ buttonLabel }}<\u002Fbutton>\n          <\u002Fform>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:40px 0;text-align:center\">\n            <div style=\"font-weight:700;font-size:26px;letter-spacing:-.02em;color:#D9A441\">Thank you.<\u002Fdiv>\n            <p style=\"font-size:17px;line-height:1.55;color:#A8A390;margin:14px 0 0\">We'll be in touch shortly.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background:#12130C;border-top:1px solid rgba(238,235,220,.14);padding:64px
