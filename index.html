7\" cy=\"66\" r=\"2\" fill=\"#12130C\" opacity=\".6\"><\u002Fcircle><circle cx=\"85\" cy=\"66\" r=\"2\" fill=\"#12130C\" opacity=\".6\"><\u002Fcircle>\n          <line x1=\"8\" y1=\"92\" x2=\"98\" y2=\"92\" stroke=\"#EEEBDC\" stroke-width=\"2.2\" opacity=\".45\"><\u002Fline>\n        <\u002Fsvg>\n        <span style=\"font-weight:700;font-size:15px;letter-spacing:-.02em;text-transform:uppercase\">InclusiveGrowth<span style=\"color:#D9A441\">.AI<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#D9A441;font-weight:600;margin-top:44px\">Sources<\u002Fdiv>\n      <p style=\"font-size:14px;line-height:1.7;color:#6E6A57;margin:16px 0 0;max-width:1000px;text-wrap:pretty\">The Budget Lab at Yale, <em>Evaluating the Impact of AI on the Labor Market<\u002Fem> · Brookings, <em>New data show no AI jobs apocalypse — for now<\u002Fem> and <em>Data center backlash signals a fight over AI power<\u002Fem> · Data Center Watch, Q1 2026 briefings · Heatmap Pro, local opposition tracking · Newsweek · Forbes · NPR and NBC News on the 2026 commencement boos · Pew Research Center · Gallup, March 2026 · Reuters/Ipsos · Cato Institute · Good Jobs First · Rockefeller Institute of Government · McKinsey, <em>The state of AI<\u002Fem> · MIT Project NANDA, <em>The GenAI Divide<\u002Fem> · Goldman Sachs · Michigan Advance and E&amp;E News on the Michigan Affordable and Responsible Growth Pledge. Figures current as of July 2026.<\u002Fp>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;margin-top:44px;padding-top:28px;border-top:1px solid rgba(238,235,220,.14)\">\n        <span style=\"font-size:13px;letter-spacing:.04em;color:#6E6A57\">© 2026 InclusiveGrowth.AI — a project of Onward Ventures<\u002Fspan>\n        <a href=\"#top\" style=\"font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600\">Back to top ↑<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fmain>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;formEndpoint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contact form&quot;},&quot;backgroundFlow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;revealOnScroll&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;placementRhythm&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;varied&quot;,&quot;left&quot;],&quot;default&quot;:&quot;varied&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;headlineClippings&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;}}\">\nconst CLAY = [217, 164, 65], BRIGHT = [230, 188, 100], STONE = [168, 163, 144], BONE = [238, 235, 220], INK = [34, 33, 26];\n\n// One background state per scroll stop. Interpolated as you move between them.\nconst TONES = [\n  {ax:82,ay:14,ar:1300,aa:.24,bx:12,by:82,br:1000,ba:.11,bt:STONE,grid:.55,gsize:56,vig:.30},\n  {ax:14,ay:76,ar:1500,aa:.22,bx:86,by:16,br:900,ba:.09,bt:BONE,grid:.34,gsize:74,vig:.34},\n  {ax:52,ay:56,ar:900,aa:.07,bx:50,by:20,br:1500,ba:.19,bt:STONE,grid:.72,gsize:40,vig:.24},\n  {ax:96,ay:92,ar:800,aa:.06,bx:20,by:40,br:1400,ba:.16,bt:INK,grid:.20,gsize:98,vig:.46},\n  {ax:50,ay:34,ar:1600,aa:.27,bx:50,by:96,br:900,ba:.08,bt:BRIGHT,grid:.30,gsize:64,vig:.30},\n  {ax:50,ay:50,ar:1200,aa:.04,bx:50,by:50,br:1700,ba:.12,bt:BONE,grid:.62,gsize:48,vig:.20},\n  {ax:18,ay:22,ar:1000,aa:.19,bx:84,by:80,br:1000,ba:.15,bt:BRIGHT,grid:.42,gsize:56,vig:.30},\n  {ax:50,ay:98,ar:1700,aa:.26,bx:50,by:6,br:800,ba:.07,bt:STONE,grid:.48,gsize:56,vig:.36},\n  {ax:26,ay:30,ar:1100,aa:.17,bx:74,by:66,br:1100,ba:.16,bt:CLAY,grid:.38,gsize:68,vig:.28},\n  {ax:88,ay:20,ar:900,aa:.10,bx:14,by:88,br:1300,ba:.18,bt:STONE,grid:.26,gsize:86,vig:.42},\n  {ax:70,ay:62,ar:1200,aa:.12,bx:30,by:24,br:1200,ba:.17,bt:BONE,grid:.52,gsize:60,vig:.26},\n  {ax:50,ay:50,ar:520,aa:.34,bx:50,by:50,br:1800,ba:.05,bt:INK,grid:.14,gsize:120,vig:.56},\n  {ax:20,ay:16,ar:1500,aa:.21,bx:82,by:84,br:1100,ba:.12,bt:BRIGHT,grid:.50,gsize:56,vig:.28},\n  {ax:50,ay:24,ar:1400,aa:.15,bx:50,by:88,br:1200,ba:.14,bt:STONE,grid:.58,gsize:48,vig:.26},\n  {ax:78,ay:76,ar:1300,aa:.18,bx:18,by:22,br:1100,ba:.13,bt:BONE,grid:.44,gsize:64,vig:.30}\n];\n\n// Paste your Formspree endpoint here, e.g. 'https://formspree.io/f/abcdwxyz'\nconst FORM_ENDPOINT = 'https://formspree.io/f/xjgnlogk';\n\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst rgba = (c, a) => 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a.toFixed(3) + ')';\n\nclass Component extends DCLogic {\n  state = { sent: false, sending: false, error: '' };\n\n  constructor(p) {\n    super(p);\n    this.bgRef = React.createRef();\n    this.gridRef = React.createRef();\n    this.vigRef = React.createRef();\n    this.barRef = React.createRef();\n    this.gapRef = React.createRef();\n    this.evidenceRef = React.createRef();\n  }\n\n  componentDidMount() {\n    this.onScroll = () => {\n      if (this._raf) return;\n      this._raf = requestAnimationFrame(() => { this._raf = null; this.paint(); });\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    window.addEventListener('resize', this.onScroll);\n    this.paint();\n    this.wire();\n  }\n\n  componentDidUpdate() { this.wire(); this.paint(); }\n\n  paint() {\n    const h = document.documentElement.scrollHeight - window.innerHeight;\n    const p = h > 0 ? Math.min(1, Math.max(0, window.scrollY / h)) : 0;\n    if (this.barRef.current) this.barRef.current.style.width = (p * 100).toFixed(2) + '%';\n    [this.gapRef, this.evidenceRef].forEach((ref) => {\n      if (!ref.current) return;\n      const w = ref.current.clientWidth;\n      ref.current.style.gridTemplateColumns = 'repeat(' + (w >= 620 ? 4 : 2) + ',minmax(0,1fr))';\n    });\n\n    if (this.props.backgroundFlow === false) return;\n\n    const stops = Array.prototype.slice.call(document.querySelectorAll('[data-tone]'));\n    if (!stops.length) return;\n    const mid = window.innerHeight / 2;\n    let idx = 0, t = 0;\n    for (let i = 0; i < stops.length; i++) {\n      const r = stops[i].getBoundingClientRect();\n      if (r.top <= mid && r.bottom > mid) {\n        idx = i;\n        t = Math.min(1, Math.max(0, (mid - r.top) / Math.max(1, r.height)));\n        break;\n      }\n      if (r.top > mid) { idx = Math.max(0, i - 1); t = 1; break; }\n      idx = i; t = 1;\n    }\n    const a = TONES[Number(stops[idx].getAttribute('data-tone')) % TONES.length];\n    const nextEl = stops[Math.min(stops.length - 1, idx + 1)];\n    const b = TONES[Number(nextEl.getAttribute('data-tone')) % TONES.length];\n    const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;\n    const v = {};\n    ['ax','ay','ar','aa','bx','by','br','ba','grid','gsize','vig'].forEach((k) => { v[k] = lerp(a[k], b[k], e); });\n    const tint = [0, 1, 2].map((i) => lerp(a.bt[i], b.bt[i], e));\n\n    if (this.bgRef.current) {\n      this.bgRef.current.style.background =\n        'radial-gradient(' + v.ar.toFixed(0) + 'px ' + (v.ar * .7).toFixed(0) + 'px at ' + v.ax.toFixed(1) + '% ' + v.ay.toFixed(1) + '%, ' + rgba(CLAY, v.aa) + ', transparent 64%),' +\n        'radial-gradient(' + v.br.toFixed(0) + 'px ' + (v.br * .78).toFixed(0) + 'px at ' + v.bx.toFixed(1) + '% ' + v.by.toFixed(1) + '%, ' + rgba(tint, v.ba) + ', transparent 68%)';\n    }\n    if (this.gridRef.current) {\n      this.gridRef.current.style.opacity = v.grid.toFixed(3);\n      this.gridRef.current.style.backgroundSize = v.gsize.toFixed(1) + 'px ' + v.gsize.toFixed(1) + 'px';\n    }\n    if (this.vigRef.current) {\n      this.vigRef.current.style.background = 'radial-gradient(120% 90% at 50% 45%, transparent 38%, rgba(13,14,9,' + v.vig.toFixed(3) + ') 100%)';\n    }\n  }\n\n  wire() {\n    if (this.props.revealOnScroll === false) {\n      document.querySelectorAll('[data-reveal]').forEach((el) => { el.style.opacity = '1'; el.style.transform = 'none'; });\n      return;\n    }\n    const mk = (margin) => new IntersectionObserver((entries, obs) => {\n      entries.forEach((e) => {\n        if (e.isIntersecting) {\n          e.target.style.opacity = '1';\n          e.target.style.transform = 'none';\n          e.target.style.filter = 'none';\n          obs.unobserve(e.target);\n        }\n      });\n    }, { rootMargin: margin, threshold: 0.02 });\n    if (!this.io) this.io = mk('0px 0px -8% 0px');\n    if (!this.ioLate) this.ioLate = mk('0px 0px -24% 0px');\n    let i = 0;\n    document.querySelectorAll('[data-reveal]:not([data-wired])').forEach((el) => {\n      el.setAttribute('data-wired', '1');\n      const r = el.getBoundingClientRect();\n      const explode = el.getAttribute('data-explode');\n      const stagger = el.hasAttribute('data-stagger') ? Number(el.getAttribute('data-stagger')) || 0 : null;\n      const d = stagger !== null ? stagger * (explode ? 110 : 170) : Math.min(i * 70, 350);\n      const dur = explode ? 1.15 : stagger !== null ? 1.05 : .75;\n      const ease = explode ? 'cubic-bezier(.16,.9,.22,1.14)' : 'cubic-bezier(.2,.7,.2,1)';\n      el.style.transition = 'opacity ' + (explode ? .7 : dur) + 's ease-out ' + d + 'ms, transform ' + dur + 's ' + ease + ' ' + d + 'ms, filter ' + dur + 's ease-out ' + d + 'ms';\n      if (r.top < window.innerHeight && r.bottom > 0) { el.style.opacity = '1'; el.style.transform = 'none'; el.style.filter = 'none'; i++; return; }\n      el.style.opacity = '0';\n      el.style.transform = explode || (stagger !== null ? 'translateY(38px)' : 'translateY(20px)');\n      if (explode) el.style.filter = 'blur(6px)';\n      (stagger !== null || explode ? this.ioLate : this.io).observe(el);\n    });\n    clearTimeout(this._safety);\n    this._safety = setTimeout(() => {\n      document.querySelectorAll('[data-reveal]').forEach((el) => { el.style.opacity = '1'; el.style.transform = 'none'; });\n    }, 6000);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.onScroll);\n    window.removeEventListener('resize', this.onScroll);\n    if (this.io) this.io.disconnect();\n    if (this.ioLate) this.ioLate.disconnect();\n    clearTimeout(this._safety);\n  }\n\n  renderVals() {\n    return {\n      evidenceRef: this.evidenceRef,\n      bgRef: this.bgRef,\n      gridRef: this.gridRef,\n      vigRef: this.vigRef,\n      barRef: this.barRef,\n      sent: this.state.sent,\n      notSent: !this.state.sent,\n      sending: this.state.sending,\n      hasError: !!this.state.error,\n      errorText: this.state.error,\n      buttonLabel: this.state.sending ? 'Sending…' : 'Send',\n      onSubmit: (e) => {\n        e.preventDefault();\n        const form = e.target;\n        const endpoint = (this.props.formEndpoint || FORM_ENDPOINT || '').trim();\n        // No endpoint configured yet — fall back to the local thank-you state.\n        if (!endpoint) { this.setState({ sent: true }); return; }\n        this.setState({ sending: true, error: '' });\n        fetch(endpoint, {\n          method: 'POST',\n          headers: { Accept: 'application/json' },\n          body: new FormData(form)\n        })\n          .then((r) => (r.ok ? r.json().catch(() => ({})) : Promise.reject(new Error('bad status'))))\n          .then(() => { this.setState({ sent: true, sending: false }); })\n          .catch(() => {\n            this.setState({\n              sending: false,\n              error: \"That didn't send. Please email us directly at hello@inclusivegrowth.ai.\"\n            });\n          });\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
